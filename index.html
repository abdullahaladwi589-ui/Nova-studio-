<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a12"><title>NOVA Studio</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#080a12;color:#f7f8ff}main{max-width:1180px;margin:auto;padding:24px}.hero,.card{background:#101422;border:1px solid #242a3c;border-radius:22px;padding:20px;box-shadow:0 12px 40px #0004}.hero{margin-bottom:16px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{flex:1;min-width:180px}textarea,input,select{width:100%;box-sizing:border-box;background:#090c14;color:#fff;border:1px solid #30374e;border-radius:12px;padding:12px;margin:7px 0}button{background:#7c5cff;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}button.secondary{background:#202840}.muted{color:#aeb5c9}.pill{display:inline-block;padding:5px 10px;border-radius:20px;background:#1c2340;margin:2px}.video{width:100%;margin-top:15px;border-radius:14px;background:#000}.hidden{display:none}.stat{font-size:24px;font-weight:800}.admin{margin-top:16px}.user{padding:10px;border-bottom:1px solid #252b3c;display:flex;justify-content:space-between;gap:8px;align-items:center}@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding:12px}.hero,.card{padding:15px}}</style></head><body><main><section class="hero"><h1>✦ NOVA Studio</h1><p class="muted">استوديو صناعة الفيديو بالذكاء الاصطناعي</p><div id="account"></div><div class="row"><button id="logout" class="secondary">تسجيل الخروج</button></div></section><div class="grid"><section class="card"><h2>🎬 إنشاء فيديو</h2><textarea id="prompt" rows="7" placeholder="اكتب وصف المشهد بالتفصيل..."></textarea><div class="row"><div class="field"><select id="mode"><option value="text-to-video">نص → فيديو</option><option value="image-to-video">صورة → فيديو</option></select></div><div class="field"><input id="image" placeholder="رابط الصورة (اختياري)"></div></div><button id="generate">توليد الفيديو</button><p id="msg" class="muted"></p><div id="result"></div><h3>مشاريعي الأخيرة</h3><div id="jobs"></div></section><section class="card"><h2>👤 الحساب</h2><div id="authBox"><input id="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><div class="row"><button id="login">دخول</button><button id="register" class="secondary">حساب جديد</button></div></div><hr><h2>⭐ Plus</h2><p>توليد غير محدود، مع مراعاة سياسات الاستخدام وتوفر محرك الفيديو.</p><div class="stat" id="price">—</div><button id="subscribe">الاشتراك في Plus</button><p class="muted">الخطة المجانية: فيديو واحد يوميًا.</p></section></div><section id="admin" class="card admin hidden"><h2>🛠️ لوحة المالك</h2><div id="stats"></div><div class="row"><input id="newPrice" placeholder="مثال: 1.99 USD / شهر"><button id="savePrice">حفظ سعر Plus</button></div><h3>المستخدمون</h3><div id="users"></div></section></main><script type="module" src="/src.js"></script></body></html>
